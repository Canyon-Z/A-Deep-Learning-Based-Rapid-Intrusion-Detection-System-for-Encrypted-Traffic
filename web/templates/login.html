<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | 加密流量入侵检测系统</title>
    <!-- 全部前端依赖走本地副本：CDN 不可达时样式会静默失效（栅格塌陷、图标变方框） -->
    <link rel="stylesheet" href="/static/vendor/tailwind.css?v=20261103f">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css?v=20261103f">
    <link rel="stylesheet" href="/static/css/styles.css?v=20261103f">
</head>
<body class="bg-cyber-bg min-h-screen flex items-center justify-center px-6">

    <div class="w-full max-w-[380px]">
        <div class="flex items-center justify-center gap-2 mb-6">
            <i class="fa-solid fa-shield-halved text-cyber-primary text-lg"></i>
            <span class="text-[15px] font-semibold text-gray-100">加密流量入侵检测系统</span>
            <span class="text-[11px] font-mono text-gray-500">DL-IDS</span>
        </div>

        <div class="glass-card rounded-xl p-7">
            <h1 class="text-base font-semibold text-gray-100 mb-1">登录</h1>
            <p class="text-xs text-gray-500 mb-6 font-mono">Encrypted Traffic Intrusion Detection</p>

            {% if error %}
            <div class="mb-4 px-3 py-2 rounded-md text-xs"
                 style="background: rgba(244, 63, 94, 0.10); color: var(--ds-danger); border: 1px solid rgba(244, 63, 94, 0.25);">
                <i class="fa-solid fa-circle-exclamation mr-1.5"></i>{{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs text-gray-400 mb-1.5">用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="w-full h-10 px-3 rounded-md text-sm text-gray-100 font-mono"
                           style="background: var(--ds-bg); border: 1px solid var(--ds-border-strong);">
                </div>
                <div>
                    <label for="password" class="block text-xs text-gray-400 mb-1.5">密码</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="w-full h-10 px-3 rounded-md text-sm text-gray-100 font-mono"
                           style="background: var(--ds-bg); border: 1px solid var(--ds-border-strong);">
                </div>
                <button type="submit" class="btn btn-primary w-full h-10 mt-2">登 录</button>
            </form>
        </div>

        <p class="text-[11px] text-gray-600 text-center mt-5 font-mono">Authorized access only</p>
    </div>

</body>
</html>
