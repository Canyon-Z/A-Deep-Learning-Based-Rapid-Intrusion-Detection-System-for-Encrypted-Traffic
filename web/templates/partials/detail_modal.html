<!-- Modal for Details (Hidden by default) -->
<div id="detailModal" onclick="if(event.target === this) closeModal()"
     class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
    <div onclick="event.stopPropagation()" class="glass-card w-full max-w-4xl max-h-[90vh] flex flex-col rounded-xl shadow-neon-red">

        <!-- Header -->
        <div class="panel-head">
            <h3 class="panel-title">
                <i class="fa-solid fa-microscope text-cyber-primary mr-2"></i>流量深度分析报告
            </h3>
            <button onclick="closeModal()" title="关闭详情" aria-label="关闭详情" class="btn btn-ghost btn-sm">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="p-5 overflow-y-auto flex-1 grid grid-cols-1 lg:grid-cols-2 gap-5">

            <!-- Left Column: Info & Verdict -->
            <div class="space-y-5">
                <div class="rounded-lg p-4" style="background: rgba(0, 0, 0, 0.25); border: 1px solid var(--ds-border);">
                    <h4 class="text-xs font-semibold text-cyber-primary mb-3 pb-2 border-b border-cyber-border">基础元数据</h4>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between gap-4"><span class="text-gray-400">文件名</span> <span class="font-mono text-gray-100 truncate max-w-[220px]" title="" id="modalFileName">-</span></div>
                        <div class="flex justify-between gap-4"><span class="text-gray-400">时间戳</span> <span class="font-mono text-gray-100" id="modalCaptureTime">-</span></div>
                        <div class="flex justify-between gap-4"><span class="text-gray-400">检测耗时</span> <span class="font-mono text-cyber-success" id="modalExecTime">-</span></div>
                        <div class="flex justify-between gap-4"><span class="text-gray-400">协议栈</span> <span class="font-mono text-gray-100">Ethernet &gt; IP &gt; TCP/UDP</span></div>
                    </div>
                </div>

                <div class="rounded-lg p-4" style="background: rgba(0, 0, 0, 0.25); border: 1px solid var(--ds-border);">
                    <h4 class="text-xs font-semibold text-cyber-primary mb-3 pb-2 border-b border-cyber-border">模型判定</h4>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="text-gray-400 text-sm">威胁判定</span>
                            <span class="px-3 py-1.5 rounded text-sm font-bold shadow-neon-red flex items-center gap-1.5 bg-cyber-danger/10 text-cyber-danger border border-cyber-danger/30" id="modalResult">
                                <i class="fa-solid fa-bug"></i> Malware
                            </span>
                        </div>
                        <div class="text-sm text-gray-400">
                            <div class="mb-1">Session 解析统计</div>
                            <div id="modalSessionParseReport" class="font-mono text-gray-300 leading-relaxed">-</div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1.5">
                                <span class="text-gray-400">模型置信度</span>
                                <span class="font-mono text-cyber-primary" id="modalConfText">0.00%</span>
                            </div>
                            <div class="w-full rounded-full h-2 overflow-hidden" style="background: rgba(255, 255, 255, 0.07);">
                                <div class="h-full rounded-full transition-all duration-700 ease-out conf-bar-initial" id="modalConfBar"
                                     style="background: var(--ds-accent);"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Image & Distribution -->
            <div class="space-y-5 flex flex-col">
                <div class="rounded-lg p-4" style="background: rgba(0, 0, 0, 0.25); border: 1px solid var(--ds-border);">
                    <h4 class="text-xs font-semibold text-cyber-primary mb-3 pb-2 border-b border-cyber-border">应用层载荷特征图 (28×28)</h4>
                    <div class="flex justify-center items-center rounded p-2 h-40" style="background: rgba(0, 0, 0, 0.3);">
                        <img id="modalImage" src="" alt="Traffic Visualization" class="h-32 object-contain pixelated-image border border-cyber-border">
                        <p id="modalNoImage" class="hidden text-sm text-gray-500">
                            <i class="fa-regular fa-image mb-2 text-2xl block text-center"></i>暂无可视化图像数据
                        </p>
                    </div>
                </div>

                <div class="rounded-lg p-4 flex-1 min-h-[220px] flex flex-col" style="background: rgba(0, 0, 0, 0.25); border: 1px solid var(--ds-border);">
                    <h4 class="text-xs font-semibold text-cyber-primary mb-2 pb-2 border-b border-cyber-border">前 784 字节分布</h4>
                    <div id="modalBarChart" class="w-full flex-1"></div>
                </div>
            </div>

            <!-- Bottom: Flow Table -->
            <div class="col-span-1 lg:col-span-2 rounded-lg p-4 overflow-hidden flex flex-col max-h-[300px]"
                 style="background: rgba(0, 0, 0, 0.25); border: 1px solid var(--ds-border);">
                <h4 class="text-xs font-semibold text-cyber-primary mb-3 pb-2 border-b border-cyber-border flex justify-between items-center">
                    <span><i class="fa-solid fa-network-wired mr-1.5"></i>多元化流量特征分析</span>
                    <span class="text-xs text-gray-400 font-mono" id="modalFlowCount">0 Sessions</span>
                </h4>
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="sticky top-0 backdrop-blur" style="background: rgba(21, 28, 40, 0.95);">
                            <tr class="text-gray-400 border-b border-cyber-border">
                                <th class="px-3 py-2 font-medium">源 IP:端口</th>
                                <th class="px-3 py-2 font-medium">目的 IP:端口</th>
                                <th class="px-3 py-2 font-medium">协议</th>
                                <th class="px-3 py-2 font-medium">应用层载荷 (Bytes)</th>
                                <th class="px-3 py-2 font-medium">特征判定</th>
                            </tr>
                        </thead>
                        <tbody id="modalFlowTableBody" class="text-gray-300"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-5 py-2.5 border-t border-cyber-border text-xs text-gray-500 font-mono flex items-center gap-2">
            <i class="fa-solid fa-terminal"></i><span>分析完成</span>
        </div>
    </div>
</div>
