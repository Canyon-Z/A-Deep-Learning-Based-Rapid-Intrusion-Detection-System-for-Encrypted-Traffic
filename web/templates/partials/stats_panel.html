<!-- KPI 状态带：4 格以 1px 分隔线连成一条 -->
<div class="col-span-12 kpi-strip">
    <div class="kpi-cell">
        <div class="kpi-label"><i class="fa-solid fa-layer-group"></i>累计检测量</div>
        <div class="kpi-value font-mono" id="statTotal">0</div>
        <div class="kpi-foot">本次会话处理的检测次数</div>
    </div>

    <div class="kpi-cell">
        <div class="kpi-label"><i class="fa-solid fa-triangle-exclamation"></i>恶意流量发现</div>
        <div class="kpi-value is-danger font-mono" id="statMalware">0</div>
        <div class="kpi-foot">判定为 Malware 的数量</div>
    </div>

    <div class="kpi-cell">
        <div class="kpi-label"><i class="fa-solid fa-microchip"></i>当前推理模型</div>
        <div id="modelSelectorBox">
            <select id="modelSelector" title="选择检测模型" aria-label="选择检测模型" class="select-field font-mono">
                <option value="cnn_bilstm" selected>CNN-BiLSTM（默认主力）</option>
                <option value="classic_cnn">Classic CNN（经典卷积）</option>
                <option value="lightweight_cnn">Lightweight CNN-BiLSTM（轻量化）</option>
                <option value="pure_bilstm">Pure BiLSTM（双向时序）</option>
                <option value="mlp">MLP（多层感知机基线）</option>
                <option value="transformer">Transformer（自注意力）</option>
            </select>
        </div>
        <div class="kpi-foot">准确率 <span id="statActiveAcc" class="font-mono text-gray-300">--</span></div>
    </div>

    <div class="kpi-cell">
        <div class="kpi-label"><i class="fa-solid fa-people-group"></i>检测模式</div>
        <label class="flex items-center gap-2 cursor-pointer select-none mb-1">
            <input id="votingModeToggle" type="checkbox"
                   class="w-4 h-4 rounded border-cyber-border bg-cyber-bg cursor-pointer"
                   style="accent-color: var(--ds-accent)">
            <span id="votingModeLabelText" class="text-[13px] text-gray-300">单模型选择已启用</span>
        </label>
        <div class="kpi-foot"><span id="activeModelBadge" class="mc-state">CNN-BiLSTM 当前使用</span></div>
        <script>
            // 勾选状态必须在「解析到这里」的同一帧内恢复。这张 KPI 带 5 个页面都有，
            // 若等 main.js 初始化时才恢复，会先按模板默认画一遍再被改掉，看起来就是
            // 「刷新把勾选刷新了」（与侧栏 is-rail 同一个坑，用同样的内联手法避开）。
            // 默认不选：与 main.js 在没有存档时算出的 persistedVotingModeEnabled=false 一致。
            (function () {
                try {
                    var saved = JSON.parse(localStorage.getItem('dlids_ui_state') || 'null');
                    if (!saved || typeof saved.votingModeEnabled !== 'boolean') return;
                    var on = saved.votingModeEnabled;
                    var box = document.getElementById('votingModeToggle');
                    if (box) box.checked = on;
                    var label = document.getElementById('votingModeLabelText');
                    if (label) label.innerText = on ? '6 模型投票已启用' : '单模型选择已启用';
                    var badge = document.getElementById('activeModelBadge');
                    if (badge && on) badge.innerText = '6 模型投票';
                    var acc = document.getElementById('statActiveAcc');
                    if (acc && on) acc.innerHTML = '--<span class="text-gray-500 text-[11px]">%</span>';
                } catch (e) { /* 隐私模式下 localStorage 不可用：保持模板默认 */ }
            })();
        </script>
    </div>
</div>

<script>
    // 指标只有一份真源：后端 /api/metrics（读 checkpoints/model_metrics.json），
    // 不再让各页面各自去取 /static 下的副本（代码审查疑点 3）。
    (async function () {
        try {
            const r = await fetch('/api/metrics');
            if (!r.ok) return;
            const payload = await r.json();
            const body = (payload && payload.data) ? payload.data : payload;
            const map = { 'CNN_BiLSTM': 'm1', 'Classic_CNN': 'm2', 'Lightweight_CNN_BiLSTM': 'm3', 'Pure_BiLSTM': 'm4', 'MLP': 'm5', 'Transformer': 'm6' };
            function setText(id, value) {
                const el = document.getElementById(id);
                if (!el) return;
                if (value === null || value === undefined || value === '') return;
                el.innerText = String(value);
            }
            function fmtPercent(value) {
                if (value === null || value === undefined || value === '') return '--';
                return String(value).includes('%') ? String(value) : String(value) + '%';
            }
            Object.keys(map).forEach(function (k) {
                const node = body[k];
                if (!node) return;
                const prefix = map[k];
                setText(prefix + '-acc', node.test_accuracy || node.best_val_accuracy || node.best_accuracy);
                setText(prefix + '-pre', node.precision);
                setText(prefix + '-rec', node.recall);
                setText(prefix + '-f1', node.f1_score);
                setText(prefix + '-f2', node.f2_score);
                setText(prefix + '-dr', node.detection_rate);
                setText(prefix + '-fpr', fmtPercent(node.fpr));
                setText(prefix + '-fnr', fmtPercent(node.fnr));
                setText(prefix + '-lat', node.latency_ms_per_sample ? node.latency_ms_per_sample + ' ms/条' : '--');
                if (node.parameters || node.parameter_count) {
                    setText(prefix + '-par', node.parameters || node.parameter_count);
                }
                setText(prefix + '-tps', node.throughput_samples_per_sec ? node.throughput_samples_per_sec + ' 条/s' : '--');
                setText(prefix + '-auc', node.auc);
            });
            // 把整份指标缓存到全局：KPI 带在 5 个页面都出现，而 model_metrics.html 里的
            // mN-acc 元素只在「模型评估」页存在。若继续依赖那个元素，其他页面的「准确率」
            // 会一直停在 --，同一个 KPI 带在不同页面显示的数字就不一致。
            window.dlidsModelMetrics = body;
            const MODEL_KEYS = { cnn_bilstm: 'CNN_BiLSTM', classic_cnn: 'Classic_CNN', lightweight_cnn: 'Lightweight_CNN_BiLSTM', pure_bilstm: 'Pure_BiLSTM', mlp: 'MLP', transformer: 'Transformer' };
            const MODEL_PREFIX = { cnn_bilstm: 'm1', classic_cnn: 'm2', lightweight_cnn: 'm3', pure_bilstm: 'm4', mlp: 'm5', transformer: 'm6' };

            window.dlidsRenderActiveAcc = function (modelId) {
                const stat = document.getElementById('statActiveAcc');
                if (!stat) return;
                let text = null;
                const node = (window.dlidsModelMetrics || {})[MODEL_KEYS[modelId] || ''];
                if (node) {
                    const acc = node.test_accuracy || node.best_val_accuracy || node.best_accuracy;
                    if (acc !== null && acc !== undefined && acc !== '') text = String(acc).replace('%', '').trim();
                }
                if (!text) {
                    // 兜底：在「模型评估」页上退回到读 mN-acc 元素的文本
                    const el = document.getElementById((MODEL_PREFIX[modelId] || '') + '-acc');
                    const raw = el && el.innerText ? el.innerText.replace('%', '').trim() : '';
                    if (raw && raw !== '--') text = raw;
                }
                stat.innerHTML = (text || '--') + '<span class="text-gray-500 text-[11px]">%</span>';
            };

            // 用当前选中模型的 ACC 初始化 KPI
            try {
                const sel = document.getElementById('modelSelector');
                window.dlidsRenderActiveAcc(sel ? sel.value : 'cnn_bilstm');
            } catch (e) { /* 忽略：KPI 初始化失败不影响主流程 */ }
        } catch (e) { console.warn('metrics loader failed', e); }
    })();
</script>
