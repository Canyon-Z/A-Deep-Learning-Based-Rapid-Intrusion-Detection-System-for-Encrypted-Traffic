<!-- Live Capture
     本页只负责「选网卡 + 看辐射图」；开始/停止按钮在顶栏，5 个页面都能控制。 -->
<div id="liveSection" class="panel flex flex-col">
    <div class="panel-head">
        <h2 class="panel-title">
            <i class="fa-solid fa-tower-broadcast text-cyber-primary mr-2"></i>实时抓包检测
        </h2>
        <span class="panel-hint">状态 <span id="liveStatus" class="live-status"><span class="status-dot"></span><span id="liveStatusText">停止</span></span></span>
    </div>

    <div class="mx-4 mt-4 flex flex-col gap-3">
        <div class="flex items-center gap-2">
            <div id="customSelectWrapper" class="relative flex-1 min-w-0">
                <div id="selectedDisplay" class="iface-select">
                    <span id="selectedText" class="truncate text-gray-300">请选择网卡</span>
                    <i id="dropdownArrow" class="fa-solid fa-chevron-down text-[10px] text-gray-500 transition-transform"></i>
                </div>
                <ul id="dropdownMenu"
                    class="hidden absolute z-30 left-0 right-0 mt-1 max-h-56 overflow-auto rounded-lg border border-cyber-border bg-cyber-panel shadow-xl text-sm"></ul>
            </div>
            <button id="refreshIfaces" class="btn btn-ghost btn-sm" title="刷新网卡列表">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>

        <p class="text-xs text-gray-500">
            选好网卡后，用右上角的「开始抓包」启动；停止也在同一处，任意页面都能操作。
        </p>

        <div id="liveError" class="hidden text-xs rounded-md px-3 py-2"
             style="background: rgba(244, 63, 94, 0.10); color: var(--ds-danger);"></div>
    </div>

    <div id="liveFlowGraphWrap" class="mx-4 mt-3 live-flow-graph-wrap h-[31rem]">
        <!-- 图内只保留缩放控件；清空日志统一走记录卡的「清除日志」，避免两个入口做同一件事 -->
        <div class="live-flow-toolbar">
            <!-- 视图切换：辐射图看「几何方位」，桑基图看「流量占比」，两者回答的问题不同 -->
            <div class="live-flow-view-switch" role="group" aria-label="视图切换">
                <button type="button" id="liveViewRadial" class="live-flow-tool-btn live-flow-view-btn is-active"
                        data-live-view="radial" title="以本机为圆心的方位图：对端在哪个方向、是否活跃">
                    辐射图
                </button>
                <button type="button" id="liveViewSankey" class="live-flow-tool-btn live-flow-view-btn"
                        data-live-view="sankey" title="按流量占比排布：谁占用了最多带宽、是否恶意">
                    桑基图
                </button>
            </div>
            <span class="live-flow-toolbar-spacer"></span>
            <button id="liveFlowZoomOut" class="live-flow-tool-btn">-</button>
            <button id="liveFlowZoomReset" class="live-flow-tool-btn">1:1</button>
            <button id="liveFlowZoomIn" class="live-flow-tool-btn">+</button>
        </div>
        <div id="liveFlowTooltip" class="live-flow-tooltip hidden"></div>
        <div id="liveFlowGraph" class="w-full h-full"></div>
        <div id="liveSankeyGraph" class="w-full h-full hidden"></div>
    </div>

    <!-- 事件流列表：由 liveGraph.js 的 renderFlowList 渲染成「时间 | 对端 | 协议 | 字节 | 判定」
         五列表格。占位文案直接写在 HTML 里，因为未开始抓包时 renderFlowList 不会被调用，
         只靠 JS 填空态等于不填。有数据后 JS 会整个替换这里的内容。 -->
    <div id="liveFlowList" class="m-4 live-flow-list"><p class="flow-empty">暂无实时流量</p></div>
</div>
