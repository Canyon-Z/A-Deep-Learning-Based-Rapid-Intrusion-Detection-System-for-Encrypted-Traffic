<!-- 流特征 CSV 上传区。与 pcap 上传区同一套视觉语汇（panel + glass-card + scan-line），
     只有接受的扩展名和提示文案不同：这里吃 CICFlowMeter 风格的 78 维特征 CSV。 -->
<div id="flowUploadPanel" class="panel flex flex-col">
    <div class="panel-head">
        <h2 class="panel-title">
            <i class="fa-solid fa-tags text-cyber-primary mr-2"></i>上传流特征 (CSV)
        </h2>
    </div>
    <div class="p-4 flex-1 flex flex-col">
        <div id="flowDropZone"
             class="glass-card relative overflow-hidden cursor-pointer flex flex-col items-center justify-center text-center px-5 py-8 min-h-[176px] flex-1">
            <div class="scan-line"></div>
            <input type="file" id="flowFileInput" class="hidden" accept=".csv">

            <div id="flowUploadContent" class="flex flex-col items-center">
                <span class="w-11 h-11 rounded-full flex items-center justify-center mb-3"
                      style="background: var(--ds-accent-soft);">
                    <i class="fa-solid fa-file-csv text-[18px] text-cyber-primary"></i>
                </span>
                <p class="text-[15px] font-medium text-gray-100">拖拽 CSV 到此处，或点击选择</p>
                <p class="text-xs text-gray-500 mt-1.5 font-mono">78 列流特征 &middot; 单个文件最大 {{ max_upload_mb }}MB</p>
                <button id="flowChooseBtn" class="btn btn-primary btn-sm mt-4">
                    <i class="fa-solid fa-folder-open mr-1.5"></i>选择文件
                </button>
            </div>

            <div id="flowLoadingState" class="hidden flex flex-col items-center justify-center py-4 w-full">
                <div class="w-7 h-7 border-2 border-cyber-border rounded-full animate-spin mb-3"
                     style="border-top-color: var(--ds-accent);"></div>
                <p class="text-sm text-gray-300">正在分类…</p>
                <p id="flowProcessStatus" class="text-xs text-gray-500 mt-1.5 font-mono"></p>
            </div>
        </div>

        <div class="mt-3 field-row-2">
            <label class="block field-cell">
                <span class="text-[11px] text-gray-500">自动处置门槛</span>
                <input id="flowHighThreshold" type="number" min="0" max="1" step="0.01" value="0.90"
                       class="field-input">
            </label>
            <label class="block field-cell">
                <span class="text-[11px] text-gray-500">人工复核门槛</span>
                <input id="flowLowThreshold" type="number" min="0" max="1" step="0.01" value="0.50"
                       class="field-input">
            </label>
        </div>
        <p class="field-note">
            置信度不低于自动处置门槛直接定案，低于人工复核门槛进入复核队列。
        </p>
    </div>
</div>
