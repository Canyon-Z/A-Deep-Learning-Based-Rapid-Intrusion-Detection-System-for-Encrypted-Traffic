<!-- Recent Detections List -->
<div id="resultCardPanel" class="glass-card rounded-xl overflow-hidden min-h-[600px]">
    <div class="px-4 py-3 border-b border-cyber-border bg-cyber-card/50 flex justify-between items-center">
        <h3 id="resultTableTitle" class="text-lg font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-list-ul text-cyber-primary"></i> 实时抓包记录
        </h3>
        <span id="resultTableHint" class="hidden lg:inline text-xs text-gray-500 ml-2">仅记录当前实时抓包会话</span>
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1 rounded-full bg-black/20 border border-cyber-border p-1">
                <button id="recordFilterAll" type="button" class="record-filter-btn px-3 py-1 rounded-full text-xs bg-cyber-primary text-black">全部</button>
                <button id="recordFilterBenign" type="button" class="record-filter-btn px-3 py-1 rounded-full text-xs text-gray-300 hover:text-white">Benign</button>
                <button id="recordFilterMalware" type="button" class="record-filter-btn px-3 py-1 rounded-full text-xs text-gray-300 hover:text-white">Malware</button>
            </div>
            <button id="clearUploadLogsBtn" type="button" class="text-xs text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-trash"></i> 清除日志</button>
            <button id="refreshBtn" type="button" class="text-xs text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-rotate-right"></i> 刷新</button>
        </div>
    </div>

    <div id="resultTableViewport" class="overflow-auto max-h-[700px]">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="text-xs text-gray-500 bg-cyber-card border-b border-cyber-border sticky top-0 z-10">
                    <th class="px-4 py-2.5 font-medium">文件名</th>
                    <th class="px-4 py-2.5 font-medium">检测时间</th>
                    <th class="px-4 py-2.5 font-medium">耗时</th>
                    <th class="px-4 py-2.5 font-medium">大小</th>
                    <th class="px-4 py-2.5 font-medium">结果</th>
                    <th class="px-4 py-2.5 font-medium">模型</th>
                    <th class="px-4 py-2.5 font-medium">置信度</th>
                    <th class="px-4 py-2.5 font-medium">操作</th>
                </tr>
            </thead>
            <tbody id="resultTableBody" class="text-sm text-gray-300">
                <!-- JS will populate rows here -->
                <tr class="border-b border-cyber-border/50 hover:bg-cyber-card/30 transition-colors">
                    <td class="px-6 py-4 font-mono text-gray-500 text-center" colspan="8">暂无检测记录，请上传文件开始检测</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
